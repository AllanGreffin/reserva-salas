server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Content Security Policy: só recursos da própria origem; nenhum script ou estilo inline,
    # nenhum plugin, nenhum enquadramento por outros sites. É a segunda camada contra XSS,
    # depois do escape de interpolação do Angular.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Mesma origem para o navegador: /api é repassado à API, que não é exposta fora da rede do compose.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # Sobrescreve (não acrescenta) o X-Forwarded-For: o cliente não consegue forjar o próprio IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rotas do Angular (ex.: /reservas/5/editar) caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

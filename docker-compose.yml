# Sobe banco, migrations, API e frontend: copie .env.example para .env, preencha e rode
#   docker compose up --build
# A aplicação fica em http://localhost:8080. Só o frontend (nginx) é exposto; API e banco
# ficam na rede interna do compose.

name: reserva-salas

x-conexao: &conexao "Server=db;Database=ReservaSalas;User Id=sa;Password=${SQL_SENHA_SA:?Defina SQL_SENHA_SA no .env (veja .env.example)};TrustServerCertificate=True"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SENHA_SA:?Defina SQL_SENHA_SA no .env (veja .env.example)}
    volumes:
      - dados-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Aplica as migrations (schema + seed) e termina. A API só sobe depois que isso dá certo.
  migrations:
    build:
      context: ./backend
      target: migrations
    environment:
      ConnectionStrings__ReservaSalas: *conexao
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Lê o IP real do X-Forwarded-For enviado pelo nginx (rate limit por cliente, não por proxy).
      # Seguro só porque a API não é acessível de fora da rede do compose.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__ReservaSalas: *conexao
      Jwt__ChaveAssinatura: ${JWT_CHAVE:?Defina JWT_CHAVE no .env (veja .env.example)}
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dados-sql:
